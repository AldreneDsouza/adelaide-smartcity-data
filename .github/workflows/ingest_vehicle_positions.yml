name: Ingest Adelaide Metro Vehicle Positions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install gtfs-realtime-bindings

      - name: Run vehicle position ingestion
        run: python src/ingest_vehicle_positions.py
