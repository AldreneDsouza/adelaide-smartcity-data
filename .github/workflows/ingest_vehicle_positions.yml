name: Ingest Adelaide Metro Vehicle Positions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install gtfs-realtime-bindings

      - name: Run vehicle position ingestion
        run: python src/ingest_vehicle_positions.py

      - name: Save latest vehicle data
        run: cp "$(ls -t data/raw/vehicle_positions_*.json | head -1)" data/raw/latest_vehicle_positions.json

      - name: Commit latest vehicle data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/latest_vehicle_positions.json
          git commit -m "Update latest vehicle position data" || echo "No changes to commit"
          git push
